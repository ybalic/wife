<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title> Wife</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };

</head>

<body>
  <!-- Ambient animated background -->
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--top" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--bottom" aria-hidden="true"></div>

  <main class="container" id="main-container">
    <!-- Profile Section -->
    <section class="profile" aria-label="Foto de perfil do casal">
      <div class="profile__ring">
        <div class="profile__ring-gradient" aria-hidden="true"></div>
        <div class="profile__image-wrapper">
          <img src="profile.png" alt="Foto do casal" class="profile__image" width="160" height="160" loading="eager">
        </div>
      </div>
      <div class="profile__verified" aria-label="Perfil verificado" title="Verificado">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </section>

    <!-- Location Badge -->
    <section class="location" aria-label="Localização">
      <div class="location__badge">
        <div class="location__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z"
              fill="currentColor" />
          </svg>
        </div>
        <p class="location__text">
          Esposa está em <span class="location__city">sua região</span>
        </p>
      </div>
    </section>

    <!-- CTA Buttons -->
    <section class="actions" aria-label="Ações principais">
      <a href="https://t.me/+dFcUbVUIivBiZWQ5" class="btn btn--primary" id="btn-grupos" role="button">
        <span class="btn__glow" aria-hidden="true"></span>
        <span class="btn__content">
          <svg class="btn__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17 21V19C17 16.7909 15.2091 15 13 15H5C2.79086 15 1 16.7909 1 19V21M23 21V19C22.9986 17.1771 21.765 15.5857 20 15.13M16 3.13C17.7699 3.58317 19.0078 5.17799 19.0078 7.005C19.0078 8.83201 17.7699 10.4268 16 10.88M13 7C13 9.20914 11.2091 11 9 11C6.79086 11 5 9.20914 5 7C5 4.79086 6.79086 3 9 3C11.2091 3 13 4.79086 13 7Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Grupos de Prévias</span>
        </span>
      </a>

      <a href="https://t.me/Iamesposabot?start=pressel" class="btn btn--secondary" id="btn-comprar" role="button">
        <span class="btn__glow" aria-hidden="true"></span>
        <span class="btn__content">
          <svg class="btn__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Acessar Conteúdo Exclusivo</span>
        </span>
      </a>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__line" aria-hidden="true"></div>
      <p class="footer__text">&copy; 2026 &middot; Todos os direitos reservados</p>
    </footer>
  </main>



  <script src="app.js"></script>
</body>

</html>
